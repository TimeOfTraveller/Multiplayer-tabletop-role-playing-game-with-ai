<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="data:,">
    <title>多人叙事</title>
    <style>
        :root {
            --bg: #0f1114;
            --bg-soft: #13161a;
            --panel: #181b20;
            --panel-2: #1d2127;
            --line: #2b3038;
            --line-soft: #23272d;
            --ink: #eae7e0;
            --ink-2: #cdc9c1;
            --muted: #9aa0a6;
            --brass: #c9a76a;
            --brass-dim: #7d6438;
            --danger: #cf6f5f;
            --ok: #86b39a;
            --radius: 10px;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
        }

        html {
            height: 100%;
        }

        body {
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: var(--bg);
            color: var(--ink);
            font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
            font-size: 15px;
            -webkit-font-smoothing: antialiased;
        }

        button, input {
            font-family: inherit;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* ---------- 顶栏 ---------- */
        .topbar {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 18px;
            border-bottom: 1px solid var(--line);
            background: var(--bg-soft);
            flex: 0 0 auto;
        }

        .identity {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            flex: 1 1 auto;
        }

        .scenario-title {
            max-width: 320px;
            margin-right: 4px;
            color: var(--brass);
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge {
            flex: 0 0 auto;
            padding: 4px 10px;
            border: 1px solid var(--line);
            border-radius: 999px;
            color: var(--muted);
            background: var(--panel);
            font-size: 12px;
            line-height: 1.4;
            white-space: nowrap;
        }

        .badge.strong {
            color: var(--brass);
            border-color: var(--brass-dim);
        }

        /* 手机端顶栏的精简自身状态；宽屏仍以名单卡片呈现 */
        .hp-badge {
            display: none;
        }

        .hp-badge.low {
            color: var(--danger);
            border-color: rgba(207, 111, 95, 0.55);
        }

        .xp-block {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 0 0 auto;
        }

        .xp-track {
            width: 132px;
            height: 6px;
            border-radius: 999px;
            background: #24282f;
            border: 1px solid var(--line);
            overflow: hidden;
        }

        .xp-fill {
            height: 100%;
            width: 0;
            background: var(--brass);
            transition: width 0.35s ease;
        }

        .xp-text {
            min-width: 62px;
            color: var(--muted);
            font-size: 11.5px;
            font-variant-numeric: tabular-nums;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 0 0 auto;
            color: var(--muted);
            font-size: 12px;
            white-space: nowrap;
        }

        .status::before {
            content: "";
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--muted);
        }

        .status.on::before {
            background: var(--ok);
        }

        .status.off::before {
            background: var(--danger);
        }

        /* ---------- 三栏工作区 ---------- */
        .workspace {
            flex: 1 1 auto;
            display: grid;
            grid-template-columns: 280px minmax(0, 1fr) 232px;
            grid-template-areas: "rail story side";
            min-height: 0;
        }

        .rail {
            grid-area: rail;
            min-height: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
            padding: 18px 16px;
            border-right: 1px solid var(--line);
            background: var(--bg-soft);
        }

        .rail.side {
            grid-area: side;
            border-right: none;
            border-left: 1px solid var(--line);
        }

        .panel {
            margin: 0;
        }

        .panel-head {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
        }

        .label {
            color: var(--brass);
            font-size: 11px;
            letter-spacing: 2.5px;
            font-weight: 600;
        }

        .label.sub {
            margin: 14px 0 5px;
            color: var(--muted);
            letter-spacing: 1.5px;
            font-weight: 400;
            font-size: 10.5px;
        }

        .label.sub:first-child {
            margin-top: 2px;
        }

        /* 战况：本轮提交/等待状态 */
        .turn-status {
            color: var(--muted);
            font-size: 11.5px;
            line-height: 1.6;
            letter-spacing: 0.3px;
        }

        .turn-status.waiting {
            display: flex;
            align-items: baseline;
            gap: 6px;
            color: var(--ink-2);
        }

        .turn-status.waiting::before {
            content: "";
            flex: 0 0 auto;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--brass);
            animation: breathe 2.4s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% {
                opacity: 0.3;
            }
            50% {
                opacity: 1;
            }
        }

        .roster {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .hp-card {
            padding: 9px 11px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--panel);
        }

        .hp-card.self {
            border-color: var(--brass-dim);
            background: #1a1c1f;
        }

        .hp-card.down {
            opacity: 0.5;
        }

        /* 自己掉血：保留红色提示，但只做一次短促的底色呼吸 */
        .hp-card.flash {
            animation: hpFlash 0.9s ease-out 2;
        }

        @keyframes hpFlash {
            0% {
                background: rgba(207, 111, 95, 0.22);
                border-color: rgba(207, 111, 95, 0.55);
            }
            100% {
                background: var(--panel);
                border-color: var(--line);
            }
        }

        .hp-card-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
            font-size: 12.5px;
        }

        .hp-name {
            color: var(--ink);
            letter-spacing: 0.5px;
        }

        .hp-card.self .hp-name {
            color: var(--brass);
        }

        .hp-value {
            color: var(--ink-2);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .hp-bar {
            margin-top: 7px;
            height: 5px;
            border-radius: 999px;
            background: #262a30;
            overflow: hidden;
        }

        .hp-fill {
            height: 100%;
            width: 0;
            background: #b0604f;
            transition: width 0.3s ease;
        }

        .background {
            margin: 0;
            color: var(--ink-2);
            font-size: 13.5px;
            line-height: 1.85;
        }

        .goal {
            margin: 0;
            padding: 10px 12px;
            border-left: 2px solid var(--brass-dim);
            border-radius: 0 8px 8px 0;
            background: var(--panel);
            color: #e4d7bd;
            font-size: 13.5px;
            line-height: 1.8;
        }

        /* 可折叠面板：桌面默认展开，手机默认收起（见脚本） */
        details.panel > summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            min-height: 32px;
            list-style: none;
            cursor: pointer;
            user-select: none;
        }

        details.panel > summary::-webkit-details-marker {
            display: none;
        }

        details.panel > summary::after {
            content: "+";
            color: var(--muted);
            font-size: 14px;
            line-height: 1;
        }

        details.panel[open] > summary::after {
            content: "–";
        }

        /* ---------- 叙事主体 ---------- */
        .story {
            grid-area: story;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: var(--bg);
        }

        .story-stream {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            padding: 26px clamp(16px, 4vw, 44px) 18px;
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: #333a43 transparent;
        }

        .bubble {
            position: relative;
            width: 100%;
            max-width: 70ch;
            padding: 14px 18px 15px;
            border: 1px solid var(--line);
            border-left: 2px solid var(--brass-dim);
            border-radius: 3px 12px 12px 12px;
            background: var(--panel);
            color: var(--ink);
            font-size: 16px;
            line-height: 1.85;
            letter-spacing: 0.01em;
            animation: rise 0.3s ease-out;
        }

        .bubble .bubble-time {
            display: block;
            margin-bottom: 5px;
            color: var(--muted);
            font-size: 10.5px;
            letter-spacing: 1.5px;
        }

        .bubble:not(.levelup) .bubble-time::before {
            content: "你 · ";
            color: var(--brass);
        }

        .bubble.placeholder {
            border-left-color: var(--line);
            border-style: dashed;
            background: transparent;
            color: var(--muted);
            font-size: 14px;
        }

        .bubble.placeholder .bubble-time {
            display: none;
        }

        /* 系统消息（升级）：双线边框 + 标记，不靠颜色单一区分 */
        .bubble.levelup {
            border: 1px solid var(--brass-dim);
            border-left: 4px double var(--brass);
            background: linear-gradient(180deg, rgba(201, 167, 106, 0.09), var(--panel) 65%);
            color: #efe4cd;
        }

        .bubble.levelup .bubble-time {
            color: var(--brass);
        }

        .bubble.levelup .bubble-time::before {
            content: "系统 · ";
            color: var(--brass);
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---------- 物品栏 ---------- */
        .inventory-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .inventory-list li {
            padding: 9px 11px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            color: var(--ink-2);
            font-size: 13px;
            line-height: 1.6;
        }

        .inventory-list .empty {
            border-style: dashed;
            background: transparent;
            color: var(--muted);
            font-size: 12.5px;
        }

        /* ---------- 输入区 ---------- */
        .composer {
            flex: 0 0 auto;
            display: flex;
            align-items: stretch;
            gap: 10px;
            padding: 12px clamp(16px, 4vw, 44px) calc(12px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--line);
            background: var(--bg-soft);
        }

        .composer input {
            flex: 1 1 auto;
            min-width: 0;
            min-height: 46px;
            padding: 11px 14px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--panel);
            color: var(--ink);
            font-size: 15px;
            outline: none;
        }

        .composer input::placeholder {
            color: #767d86;
        }

        .composer input:focus {
            border-color: var(--brass-dim);
        }

        .composer input:disabled {
            background: var(--bg-soft);
            color: var(--muted);
        }

        .composer button {
            flex: 0 0 auto;
            min-height: 46px;
            padding: 0 20px;
            border: 1px solid var(--brass-dim);
            border-radius: var(--radius);
            background: var(--brass);
            color: #191308;
            font-size: 14.5px;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .composer button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .composer button.ghost {
            border-color: var(--line);
            background: var(--panel-2);
            color: var(--ink-2);
            font-weight: 400;
            letter-spacing: 0.5px;
            padding: 0 16px;
        }

        .composer button.ghost:hover {
            border-color: var(--brass-dim);
        }

        button:focus-visible,
        input:focus-visible,
        summary:focus-visible {
            outline: 2px solid var(--brass);
            outline-offset: 2px;
        }

        /* ---------- 终局结算 ---------- */
        .ending-overlay {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(8, 9, 11, 0.82);
            backdrop-filter: blur(4px);
            animation: fade-in 0.25s ease;
        }

        .ending-overlay[hidden] {
            display: none;
        }

        @keyframes fade-in {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .ending-panel {
            width: min(620px, 100%);
            max-height: min(86dvh, 760px);
            overflow-y: auto;
            padding: 28px 30px 24px;
            border: 1px solid var(--line);
            border-top: 2px solid var(--brass-dim);
            border-radius: 14px;
            background: var(--panel);
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
            animation: rise 0.35s ease;
        }

        .ending-panel.win {
            border-top-color: var(--brass);
        }

        .ending-panel.lose {
            border-top-color: #7d4b45;
        }

        .ending-panel.draw {
            border-top-color: var(--line);
        }

        .ending-kicker {
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 4px;
        }

        .ending-headline {
            margin: 8px 0 10px;
            color: var(--ink);
            font-size: clamp(24px, 6vw, 30px);
            letter-spacing: 3px;
        }

        .ending-panel.win .ending-headline {
            color: var(--brass);
        }

        .ending-panel.lose .ending-headline {
            color: #dda49c;
        }

        .ending-narrative {
            margin: 0 0 16px;
            color: var(--ink-2);
            font-size: 15px;
            line-height: 1.85;
        }

        .ending-conditions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 18px;
        }

        .ending-chip {
            padding: 5px 11px;
            border: 1px solid var(--brass-dim);
            border-radius: 999px;
            background: transparent;
            color: #e2cfa8;
            font-size: 12px;
        }

        .table-scroll {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .ending-table {
            width: 100%;
            min-width: 400px;
            border-collapse: collapse;
            font-size: 13px;
        }

        .ending-table th,
        .ending-table td {
            padding: 9px 10px;
            border-bottom: 1px solid var(--line-soft);
            text-align: left;
        }

        .ending-table th {
            color: var(--muted);
            font-weight: 400;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .ending-table tr.winner td {
            color: var(--brass);
            font-weight: 700;
        }

        .ending-table td.defeated {
            color: var(--danger);
        }

        .ending-hint {
            margin: 16px 0 0;
            padding-top: 12px;
            border-top: 1px dashed var(--line);
            color: var(--muted);
            font-size: 12px;
            line-height: 1.7;
        }

        /* ---------- 平板：两栏 ---------- */
        @media (max-width: 1023px) {
            .workspace {
                grid-template-columns: 244px minmax(0, 1fr);
                grid-template-rows: minmax(0, 1fr) auto;
                grid-template-areas:
                    "rail story"
                    "side story";
            }

            .rail {
                border-right: 1px solid var(--line);
                border-bottom: none;
                padding: 14px;
            }

            .rail.side {
                border-left: none;
                border-top: 1px solid var(--line);
                max-height: 34vh;
                padding: 12px 14px;
            }

            .story-stream {
                padding: 22px 24px 16px;
            }

            .composer {
                padding-left: 24px;
                padding-right: 24px;
            }
        }

        /* ---------- 手机：单栏 + 吸底输入 ---------- */
        @media (max-width: 640px) {
            .topbar {
                flex-wrap: wrap;
                gap: 8px;
                padding: 8px 12px;
                padding-top: calc(8px + env(safe-area-inset-top));
            }

            .identity {
                flex: 1 1 100%;
                gap: 6px;
            }

            .scenario-title {
                max-width: none;
                flex: 1 1 auto;
                font-size: 14px;
            }

            .scenario-title ~ .badge {
                font-size: 11px;
                padding: 3px 8px;
            }

            #playerBadge {
                display: none;
            }

            .xp-block {
                order: 2;
                margin-left: 0;
                gap: 8px;
            }

            .xp-track,
            .xp-text {
                display: none;
            }

            .hp-badge {
                display: inline-flex;
                align-items: center;
                font-variant-numeric: tabular-nums;
            }

            .status {
                order: 3;
                margin-left: auto;
                font-size: 11.5px;
            }

            .workspace {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: auto auto minmax(0, 1fr);
                grid-template-areas:
                    "rail"
                    "side"
                    "story";
            }

            .rail {
                flex-direction: column;
                align-items: stretch;
                gap: 4px;
                padding: 10px 12px 6px;
                border-right: none;
                border-bottom: 1px solid var(--line-soft);
                overflow: visible;
            }

            .rail.side {
                max-height: none;
                border-top: none;
                border-bottom: 1px solid var(--line-soft);
                padding: 0 12px;
            }

            .rail .panel:first-child {
                flex: 0 0 auto;
                min-width: 0;
            }

            .panel-head {
                gap: 4px;
                margin-bottom: 8px;
            }

            .label {
                letter-spacing: 2px;
                font-size: 10.5px;
            }

            .turn-status {
                font-size: 11px;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
            }

            .roster {
                flex-direction: row;
                gap: 8px;
                overflow-x: auto;
                padding-bottom: 4px;
                margin-bottom: -2px;
                scroll-snap-type: x proximity;
                -webkit-overflow-scrolling: touch;
            }

            .roster::-webkit-scrollbar {
                height: 3px;
            }

            .hp-card {
                flex: 0 0 auto;
                min-width: 148px;
                padding: 8px 10px;
                scroll-snap-align: start;
            }

            .hp-card-head {
                font-size: 12px;
            }

            details.panel > summary {
                min-height: 44px;
            }

            .rail.side details.panel > summary {
                min-height: 44px;
            }

            .story-stream {
                align-items: stretch;
                padding: 16px 14px 12px;
                gap: 12px;
            }

            .bubble {
                max-width: none;
                padding: 12px 14px 13px;
                font-size: 16px;
                line-height: 1.8;
            }

            .composer {
                gap: 8px;
                padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
            }

            .composer input {
                min-height: 46px;
                padding: 10px 12px;
                font-size: 16px;
            }

            .composer button {
                min-width: 64px;
                min-height: 46px;
                padding: 0 14px;
            }

            .composer button.ghost {
                min-width: 56px;
                padding: 0 12px;
            }

            .ending-overlay {
                padding: 12px;
                align-items: flex-end;
            }

            .ending-panel {
                max-height: 84dvh;
                padding: 20px 18px 18px;
                border-radius: 14px;
            }

            .ending-table {
                min-width: 0;
                font-size: 12px;
            }

            .ending-table th,
            .ending-table td {
                padding: 8px 5px;
                word-break: break-word;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
<div class="app">
    <header class="topbar">
        <div class="identity">
            <span id="scenarioTitle" class="scenario-title">剧本加载中…</span>
            <span id="roomBadge" class="badge strong">房间 --</span>
            <span id="playerBadge" class="badge">玩家 --</span>
            <span id="turnBadge" class="badge">第 1 轮</span>
        </div>
        <div class="xp-block">
            <span id="levelBadge" class="badge strong">Lv.1</span>
            <span id="hpBadge" class="badge hp-badge">HP --</span>
            <div class="xp-track"><div id="xpFill" class="xp-fill"></div></div>
            <span id="xpText" class="xp-text">0 / 100</span>
        </div>
        <div id="status" class="status off">未连接</div>
    </header>

    <div class="workspace">
        <aside class="rail">
            <section class="panel">
                <div class="panel-head">
                    <span class="label">战况</span>
                    <div id="turnStatus" class="turn-status">等待本轮第一份行动…</div>
                </div>
                <div id="roster" class="roster"></div>
            </section>

            <details class="panel meta-panel">
                <summary><span class="label">背景与目标</span></summary>
                <div>
                    <div class="label sub">世界观</div>
                    <p id="worldview" class="background">正在加载剧本…</p>
                    <div class="label sub">开场</div>
                    <p id="background" class="background">正在加载剧本…</p>
                    <div class="label sub">你的秘密目标</div>
                    <p id="secretGoal" class="goal">—</p>
                </div>
            </details>
        </aside>

        <main class="story">
            <div id="story" class="story-stream" aria-live="polite">
                <div class="bubble placeholder" id="storyPlaceholder">等待你的第一个行动…</div>
            </div>

            <footer class="composer">
                <input id="intentInput" type="text" maxlength="200" autocomplete="off"
                       placeholder="你要做什么？例如：我推开门，听听走廊尽头的声音">
                <button id="skipBtn" class="ghost" type="button">观望</button>
                <button id="sendBtn" type="button">发送</button>
            </footer>
        </main>

        <aside class="rail side">
            <details class="panel inventory-panel">
                <summary><span class="label">物品栏</span></summary>
                <ul id="inventoryList" class="inventory-list">
                    <li class="empty">背包还是空的</li>
                </ul>
            </details>
        </aside>
    </div>
</div>

<div id="endingOverlay" class="ending-overlay" hidden>
    <div id="endingPanel" class="ending-panel" role="dialog" aria-modal="true" aria-labelledby="endingHeadline">
        <div class="ending-kicker">对局结束</div>
        <h2 id="endingHeadline" class="ending-headline"></h2>
        <p id="endingNarrative" class="ending-narrative"></p>
        <div id="endingConditions" class="ending-conditions"></div>
        <div class="table-scroll">
            <table class="ending-table">
                <thead>
                <tr>
                    <th>玩家</th>
                    <th>等级</th>
                    <th>HP</th>
                    <th>阵营</th>
                    <th>状态</th>
                </tr>
                </thead>
                <tbody id="endingPlayers"></tbody>
            </table>
        </div>
        <p class="ending-hint">本局已结束，输入已锁定。管理员保存或重载剧本后，本房间会回到初始状态，可重新开始。</p>
    </div>
</div>

<script>
    (function () {
        "use strict";

        var ROOM_PATTERN = /^[A-Za-z0-9_-]{1,32}$/;
        var RECONNECT_INITIAL_MS = 1000;
        var RECONNECT_MAX_MS = 15000;
        // 服务端在“同房间同玩家重复连接”时用 1000 + 该 reason 关闭旧会话。
        // 此时旧页面必须停止重连，否则两个页面会互相顶替，形成每秒一次的重连循环。
        var WS_NORMAL_CLOSURE = 1000;
        var REPLACED_REASON = "replaced by newer connection";
        var ITEM_DISPLAY = {
            found_key: "钥匙"
        };
        var PLACEHOLDER_ID = "storyPlaceholder";
        // 距离底部多少像素内视为“仍在看最新”，超过则暂停自动滚动，避免打断用户往回翻。
        var AUTOSCROLL_THRESHOLD = 72;
        var ENDING_LABELS = {
            collect_items: "集齐指定物品",
            last_standing: "成为唯一没有倒下的玩家",
            max_turns: "达到轮数上限后按剩余生命判定"
        };

        var params = new URLSearchParams(window.location.search);
        var room = params.get("room");
        var player = params.get("player");

        var roomBadge = document.getElementById("roomBadge");
        var playerBadge = document.getElementById("playerBadge");
        var turnBadge = document.getElementById("turnBadge");
        var turnStatusEl = document.getElementById("turnStatus");
        var statusEl = document.getElementById("status");
        var scenarioTitleEl = document.getElementById("scenarioTitle");
        var worldviewEl = document.getElementById("worldview");
        var backgroundEl = document.getElementById("background");
        var secretGoalEl = document.getElementById("secretGoal");
        var rosterEl = document.getElementById("roster");
        var levelBadge = document.getElementById("levelBadge");
        var hpBadge = document.getElementById("hpBadge");
        var xpFill = document.getElementById("xpFill");
        var xpText = document.getElementById("xpText");
        var storyEl = document.getElementById("story");
        var inventoryEl = document.getElementById("inventoryList");
        var inputEl = document.getElementById("intentInput");
        var sendBtn = document.getElementById("sendBtn");
        var skipBtn = document.getElementById("skipBtn");
        var endingOverlay = document.getElementById("endingOverlay");
        var endingPanel = document.getElementById("endingPanel");
        var endingHeadline = document.getElementById("endingHeadline");
        var endingNarrative = document.getElementById("endingNarrative");
        var endingConditions = document.getElementById("endingConditions");
        var endingPlayers = document.getElementById("endingPlayers");

        var socket = null;
        // 终局后页面进入只读态：不再允许发送、观望或继续追加可操作状态
        var ended = false;
        var reconnectDelay = RECONNECT_INITIAL_MS;
        var reconnectTimer = null;
        var ready = !!(room && ROOM_PATTERN.test(room) && player);
        // 记录双方上一次的 HP，用于判断“自己掉血”并触发红色闪烁
        var previousHp = {};

        roomBadge.textContent = room ? ("房间 " + room) : "房间 --";
        playerBadge.textContent = player ? ("玩家 " + player) : "玩家 --";

        function setStatus(text, state) {
            statusEl.textContent = text;
            statusEl.className = "status " + (state || "off");
        }

        /**
         * 纯布局行为：桌面默认展开背景/物品，窄屏默认收起，把首屏留给叙事。
         * 不改变任何数据与接口，用户仍可随时手动展开。
         */
        var narrowQuery = window.matchMedia("(max-width: 640px)");

        function syncCollapsiblePanels() {
            var panels = document.querySelectorAll("details.panel");
            for (var i = 0; i < panels.length; i++) {
                panels[i].open = !narrowQuery.matches;
            }
        }

        syncCollapsiblePanels();
        if (typeof narrowQuery.addEventListener === "function") {
            narrowQuery.addEventListener("change", syncCollapsiblePanels);
        } else if (typeof narrowQuery.addListener === "function") {
            narrowQuery.addListener(syncCollapsiblePanels);
        }

        function wsUrl() {
            var proto = window.location.protocol === "https:" ? "wss:" : "ws:";
            return proto + "//" + window.location.host + "/ws?room=" + encodeURIComponent(room)
                + "&player=" + encodeURIComponent(player);
        }

        function itemLabel(token) {
            return ITEM_DISPLAY[token] || token;
        }

        function renderInventory(items) {
            inventoryEl.innerHTML = "";
            if (!Array.isArray(items) || items.length === 0) {
                var empty = document.createElement("li");
                empty.className = "empty";
                empty.textContent = "背包还是空的";
                inventoryEl.appendChild(empty);
                return;
            }
            items.forEach(function (token) {
                var li = document.createElement("li");
                li.textContent = itemLabel(token);
                inventoryEl.appendChild(li);
            });
        }

        function renderRoster(players, fallbackHp, fallbackMaxHp) {
            var list = Array.isArray(players) && players.length > 0
                ? players
                : [{playerId: player, name: player, hp: fallbackHp, maxHp: fallbackMaxHp}];
            rosterEl.innerHTML = "";
            list.forEach(function (state) {
                var isSelf = state.playerId === player;
                var card = document.createElement("div");
                card.className = "hp-card" + (isSelf ? " self" : "") + (state.defeated ? " down" : "");

                var head = document.createElement("div");
                head.className = "hp-card-head";
                var name = document.createElement("span");
                name.className = "hp-name";
                name.textContent = (state.name || state.playerId) + " Lv." + (state.level || 1)
                    + (isSelf ? "（你）" : "");
                var value = document.createElement("span");
                value.className = "hp-value";
                value.textContent = state.hp + " / " + state.maxHp;
                head.appendChild(name);
                head.appendChild(value);

                var bar = document.createElement("div");
                bar.className = "hp-bar";
                var fill = document.createElement("div");
                fill.className = "hp-fill";
                var ratio = state.maxHp > 0 ? Math.max(0, Math.min(1, state.hp / state.maxHp)) : 0;
                fill.style.width = (ratio * 100).toFixed(1) + "%";
                bar.appendChild(fill);

                card.appendChild(head);
                card.appendChild(bar);

                // 只有自己的 HP 下降才闪烁；对方掉血不抢自己的视觉焦点
                var lastHp = previousHp[state.playerId];
                if (isSelf && typeof lastHp === "number" && state.hp < lastHp) {
                    card.classList.add("flash");
                    window.setTimeout(function () {
                        card.classList.remove("flash");
                    }, 1900);
                }
                previousHp[state.playerId] = state.hp;

                if (isSelf && hpBadge) {
                    hpBadge.textContent = "HP " + state.hp + "/" + state.maxHp;
                    hpBadge.classList.toggle("low", state.maxHp > 0 && state.hp / state.maxHp <= 0.3);
                }

                rosterEl.appendChild(card);
            });
        }

        function appendBubble(text, kind) {
            // 先判断用户是否停留在底部：只有停留在底部才自动跟随最新叙事
            var nearBottom = storyEl.scrollHeight - storyEl.scrollTop - storyEl.clientHeight
                < AUTOSCROLL_THRESHOLD;

            var placeholder = document.getElementById(PLACEHOLDER_ID);
            if (placeholder) {
                placeholder.remove();
            }
            var bubble = document.createElement("div");
            bubble.className = "bubble" + (kind ? " " + kind : "");
            var time = document.createElement("span");
            time.className = "bubble-time";
            time.textContent = new Date().toLocaleTimeString("zh-CN", {hour12: false});
            var body = document.createElement("span");
            body.textContent = text;
            bubble.appendChild(time);
            bubble.appendChild(body);
            storyEl.appendChild(bubble);
            if (nearBottom) {
                storyEl.scrollTop = storyEl.scrollHeight;
            }
        }

        function renderExperience(view) {
            var level = typeof view.level === "number" ? view.level : 1;
            var per = typeof view.expPerLevel === "number" && view.expPerLevel > 0 ? view.expPerLevel : 100;
            var exp = typeof view.exp === "number" ? view.exp : 0;
            levelBadge.textContent = "Lv." + level;
            xpText.textContent = exp + " / " + per;
            var ratio = Math.max(0, Math.min(1, exp / per));
            xpFill.style.width = (ratio * 100).toFixed(1) + "%";
        }

        function setTurnStatus(text, waiting) {
            turnStatusEl.textContent = text;
            turnStatusEl.className = "turn-status" + (waiting ? " waiting" : "");
        }

        /**
         * 按服务端投影里的 turn / onlinePlayers / submittedPlayers 渲染本轮等待状态。
         * 在线人数与提交人数都来自房间状态，因此 2~4 人共用同一套逻辑。
         */
        function renderTurn(view) {
            var turn = typeof view.turn === "number" && view.turn > 0 ? view.turn : 1;
            turnBadge.textContent = "第 " + turn + " 轮";
            if (ended) {
                setTurnStatus("第 " + turn + " 轮 · 对局已结束，本局不再接受新行动", false);
                return;
            }
            var online = Array.isArray(view.onlinePlayers) ? view.onlinePlayers : [];
            var submitted = Array.isArray(view.submittedPlayers) ? view.submittedPlayers : [];
            if (online.length === 0) {
                setTurnStatus("第 " + turn + " 轮：当前没有其他在线玩家", false);
                return;
            }
            var waiting = online.filter(function (id) {
                return submitted.indexOf(id) === -1;
            });
            var prefix = "第 " + turn + " 轮 · 已提交 " + submitted.length + "/" + online.length;
            if (waiting.length === 0) {
                setTurnStatus(prefix + "，正在结算…", true);
            } else {
                setTurnStatus(prefix + "，等待 " + waiting.join("、"), true);
            }
        }

        /**
         * 渲染终局结算面板：列出满足的条件与每名玩家的最终公开状态，并把页面锁为只读。
         * 所有文本都通过 textContent 写入，剧本内容不会被当成 HTML 执行。
         */
        function renderEnding(ending) {
            ended = true;
            var outcome = ending.outcome === "win" || ending.outcome === "lose" ? ending.outcome : "draw";
            endingPanel.className = "ending-panel " + outcome;
            endingHeadline.textContent = outcome === "win" ? "你赢了" : (outcome === "lose" ? "你输了" : "平局");
            endingNarrative.textContent = ending.narrative || "对局已经结束。";

            endingConditions.innerHTML = "";
            var codes = Array.isArray(ending.conditions) && ending.conditions.length > 0
                ? ending.conditions : [ending.condition];
            codes.forEach(function (code) {
                var chip = document.createElement("span");
                chip.className = "ending-chip";
                chip.textContent = ENDING_LABELS[code] || code;
                endingConditions.appendChild(chip);
            });

            endingPlayers.innerHTML = "";
            var players = Array.isArray(ending.players) ? ending.players : [];
            players.forEach(function (player) {
                var row = document.createElement("tr");
                if (player.playerId === ending.winnerId) {
                    row.className = "winner";
                }
                var name = document.createElement("td");
                name.textContent = player.name || player.playerId;
                var level = document.createElement("td");
                level.textContent = "Lv." + player.level;
                var hp = document.createElement("td");
                hp.textContent = player.hp + " / " + player.maxHp;
                var faction = document.createElement("td");
                faction.textContent = player.faction || "—";
                var status = document.createElement("td");
                status.textContent = player.defeated ? "倒下" : "存活";
                if (player.defeated) {
                    status.className = "defeated";
                }
                row.appendChild(name);
                row.appendChild(level);
                row.appendChild(hp);
                row.appendChild(faction);
                row.appendChild(status);
                endingPlayers.appendChild(row);
            });

            endingOverlay.hidden = false;
            inputEl.disabled = true;
            inputEl.placeholder = "本局已结束";
            sendBtn.disabled = true;
            skipBtn.disabled = true;
        }

        function applyView(view, allowBubble) {
            if (!view) {
                return;
            }
            if (view.title) {
                scenarioTitleEl.textContent = view.title;
                document.title = view.title + " · 多人叙事";
            }
            if (view.worldview) {
                worldviewEl.textContent = view.worldview;
            }
            if (view.background) {
                backgroundEl.textContent = view.background;
            }
            if (view.ending) {
                renderEnding(view.ending);
            }
            if (view.secretGoal) {
                secretGoalEl.textContent = view.secretGoal;
            }
            if (typeof view.hp === "number" && typeof view.maxHp === "number") {
                renderRoster(view.publicPlayers, view.hp, view.maxHp);
            }
            renderTurn(view);
            renderExperience(view);
            renderInventory(view.myInventory);
            if (allowBubble && typeof view.narrativeText === "string" && view.narrativeText.trim()) {
                appendBubble(view.narrativeText.trim());
            }
            // 升级叙事与普通叙事同属一份 PlayerView，但渲染为紧随其后的独立金色气泡。
            if (allowBubble && typeof view.levelUpNarrative === "string" && view.levelUpNarrative.trim()) {
                appendBubble("【升级】" + view.levelUpNarrative.trim(), "levelup");
            }
        }

        function handleMessage(raw) {
            var view;
            try {
                view = JSON.parse(raw);
            } catch (e) {
                return;
            }
            applyView(view, true);
        }

        function fetchLatestState() {
            fetch("/debug/log?room=" + encodeURIComponent(room) + "&player=" + encodeURIComponent(player))
                .then(function (response) {
                    return response.ok ? response.json() : [];
                })
                .then(function (entries) {
                    if (Array.isArray(entries) && entries.length > 0) {
                        applyView(entries[entries.length - 1].message, false);
                    }
                })
                .catch(function () {
                    // 拉取失败不阻塞重连，WS 的初始视角会补上状态
                });
        }

        function scheduleReconnect() {
            if (!ready) {
                return;
            }
            var delay = reconnectDelay;
            reconnectDelay = Math.min(reconnectDelay * 2, RECONNECT_MAX_MS);
            setStatus("已断开，" + Math.round(delay / 1000) + " 秒后重连", "off");
            reconnectTimer = window.setTimeout(connect, delay);
        }

        function connect() {
            if (!ready) {
                return;
            }
            if (reconnectTimer) {
                window.clearTimeout(reconnectTimer);
                reconnectTimer = null;
            }
            if (socket && (socket.readyState === WebSocket.CONNECTING || socket.readyState === WebSocket.OPEN)) {
                return;
            }

            setStatus("连接中…", "off");
            var ws = new WebSocket(wsUrl());
            socket = ws;

            ws.onopen = function () {
                if (socket !== ws) {
                    return;
                }
                reconnectDelay = RECONNECT_INITIAL_MS;
                setStatus("已连接", "on");
                // 重连成功后重新拉取一次状态，避免错过断线期间的变化
                fetchLatestState();
            };

            ws.onmessage = function (event) {
                if (socket !== ws) {
                    return;
                }
                handleMessage(event.data);
            };

            ws.onclose = function (event) {
                if (socket !== ws) {
                    return;
                }
                socket = null;
                if (event && event.code === WS_NORMAL_CLOSURE && event.reason === REPLACED_REASON) {
                    ready = false;
                    setStatus("本页已被另一个连接接管，已停止接收", "off");
                    return;
                }
                scheduleReconnect();
            };

            ws.onerror = function () {
                // 关闭事件随后到达，由 onclose 统一处理重连
            };
        }

        /**
         * 提交一条行动：skip=true 表示「观望」，等同提交无行动。
         * 接口只负责入队，因此这里按返回体更新等待状态，而不是等待叙事气泡。
         */
        function submitAction(skip) {
            if (ended) {
                return;
            }
            var intent = inputEl.value.trim();
            if (!skip && !intent) {
                return;
            }
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                setStatus("连接未就绪，稍后再试", "off");
                return;
            }
            sendBtn.disabled = true;
            skipBtn.disabled = true;
            var payload = {
                room: room,
                from: player,
                intent: skip ? "" : intent,
                "private": true,
                skip: !!skip
            };
            fetch("/action", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(payload)
            }).then(function (response) {
                return response.json().catch(function () {
                    return {};
                }).then(function (body) {
                    if (!response.ok) {
                        throw new Error(body.message || ("HTTP " + response.status));
                    }
                    if (!skip) {
                        inputEl.value = "";
                    }
                    if (body.status === "settled") {
                        setTurnStatus("第 " + body.turn + " 轮已全部提交并统一结算，正在推送各自视角…", true);
                    } else {
                        setTurnStatus(body.message || "已记录，等待本轮结算", true);
                    }
                });
            }).catch(function (error) {
                setStatus("发送失败：" + error.message, "off");
            }).then(function () {
                // 结算可能在本请求期间到达，此时保持只读态，不能把按钮重新点亮
                if (!ended) {
                    sendBtn.disabled = false;
                    skipBtn.disabled = false;
                }
            });
        }

        function sendIntent() {
            submitAction(false);
        }

        function sendSkip() {
            submitAction(true);
        }

        sendBtn.addEventListener("click", sendIntent);
        skipBtn.addEventListener("click", sendSkip);
        inputEl.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                event.preventDefault();
                sendIntent();
            }
        });

        if (!ready) {
            setStatus("URL 需要 ?room=（1~32 位字母/数字/下划线/短横线）与 ?player=（剧本中的玩家，如 A/B/C）", "off");
            inputEl.disabled = true;
            sendBtn.disabled = true;
            skipBtn.disabled = true;
        } else {
            connect();
        }
    })();
</script>
</body>
</html>
